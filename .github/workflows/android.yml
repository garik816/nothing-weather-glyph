name: Android build and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 34 platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nothing-weather-glyph-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
